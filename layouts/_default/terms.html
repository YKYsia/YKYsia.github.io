{{ define "main" }}
<div id="page"><article id="article-container" class="custom-page-content">
  <div class="custom-page-heading"><i class="fas {{ if eq .Data.Plural "tags" }}fa-tags{{ else }}fa-folder-open{{ end }}" aria-hidden="true"></i><span>{{ .Title }}</span></div>
  {{ if .Data.Terms }}<div class="tag-cloud-list is-center">{{ range .Data.Terms.Alphabetical }}<a href="{{ .Page.RelPermalink }}" style="font-size: 1.1em">{{ .Page.LinkTitle }}<sup>{{ .Count }}</sup></a>{{ end }}</div>{{ else }}<div class="site-empty-state"><i class="fas fa-box-open" aria-hidden="true"></i><h2 data-i18n="empty.heading">这里还没有内容</h2><p data-i18n="empty.taxonomy">以后的标签与分类会在这里出现。</p></div>{{ end }}
</article></div>
{{ end }}
